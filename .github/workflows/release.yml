name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS ARM64
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install build dependencies
        run: brew install cmake

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
        env:
          INSTALL_SOURCE: github

      - name: Build j-indicator
        run: swiftc helpers/indicator.swift -o target/aarch64-apple-darwin/release/j-indicator -O

      - name: Build j-ax
        run: swiftc helpers/ax.swift -o target/aarch64-apple-darwin/release/j-ax -O -framework Cocoa -framework ApplicationServices

      - name: Package
        run: |
          cd target/aarch64-apple-darwin/release
          strip j
          tar -czvf j-darwin-arm64.tar.gz j j-indicator j-ax
          shasum -a 256 j-darwin-arm64.tar.gz > j-darwin-arm64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: j-darwin-arm64
          path: |
            target/aarch64-apple-darwin/release/j-darwin-arm64.tar.gz
            target/aarch64-apple-darwin/release/j-darwin-arm64.tar.gz.sha256

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: choco install cmake --installargs '"ADD_CMakeToPath=system"' -y

      - name: Build
        run: cargo build --release
        env:
          INSTALL_SOURCE: github

      - name: Package
        shell: pwsh
        run: |
          $releaseDir = "target/release"
          # 使用 7z 创建 zip（确保使用标准 Deflate 压缩，而非 PowerShell Compress-Archive 的 Deflate64）
          7z a -tzip "$releaseDir/j-windows-x64.zip" "$releaseDir/j.exe"
          $hash = (Get-FileHash -Path "$releaseDir/j-windows-x64.zip" -Algorithm SHA256).Hash
          "$hash  j-windows-x64.zip" | Out-File -FilePath "$releaseDir/j-windows-x64.zip.sha256" -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: j-windows-x64
          path: |
            target/release/j-windows-x64.zip
            target/release/j-windows-x64.zip.sha256

  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install build dependencies
        run: choco install cmake --installargs '"ADD_CMakeToPath=system"' -y

      - name: Build
        run: cargo build --release --target aarch64-pc-windows-msvc
        env:
          INSTALL_SOURCE: github

      - name: Package
        shell: pwsh
        run: |
          $releaseDir = "target/aarch64-pc-windows-msvc/release"
          # 使用 7z 创建 zip（确保使用标准 Deflate 压缩，而非 PowerShell Compress-Archive 的 Deflate64）
          7z a -tzip "$releaseDir/j-windows-arm64.zip" "$releaseDir/j.exe"
          $hash = (Get-FileHash -Path "$releaseDir/j-windows-arm64.zip" -Algorithm SHA256).Hash
          "$hash  j-windows-arm64.zip" | Out-File -FilePath "$releaseDir/j-windows-arm64.zip.sha256" -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: j-windows-arm64
          path: |
            target/aarch64-pc-windows-msvc/release/j-windows-arm64.zip
            target/aarch64-pc-windows-msvc/release/j-windows-arm64.zip.sha256

  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Build
        run: cargo build --release
        env:
          INSTALL_SOURCE: github

      - name: Package
        run: |
          cd target/release
          strip j
          tar -czvf j-linux-x64.tar.gz j
          sha256sum j-linux-x64.tar.gz > j-linux-x64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: j-linux-x64
          path: |
            target/release/j-linux-x64.tar.gz
            target/release/j-linux-x64.tar.gz.sha256

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          INSTALL_SOURCE: github

      - name: Package
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          aarch64-linux-gnu-strip j
          tar -czvf j-linux-arm64.tar.gz j
          sha256sum j-linux-arm64.tar.gz > j-linux-arm64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: j-linux-arm64
          path: |
            target/aarch64-unknown-linux-gnu/release/j-linux-arm64.tar.gz
            target/aarch64-unknown-linux-gnu/release/j-linux-arm64.tar.gz.sha256

  release:
    name: Create Release
    needs: [build-macos, build-windows-x64, build-windows-arm64, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: j-darwin-arm64
          path: artifacts

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: j-windows-x64
          path: artifacts

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: j-windows-arm64
          path: artifacts

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: j-linux-x64
          path: artifacts

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: j-linux-arm64
          path: artifacts

      - name: Extract changelog for this version
        id: changelog
        run: |
          {
            echo 'body<<EOF'
            awk 'NR==1{next} /^# v/{exit} {print}' CHANGELOG.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: artifacts/*

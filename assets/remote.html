<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sprite Remote</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #1a1a2e; --bg2: #16213e; --fg: #e0e0e0; --fg2: #a0a0b0;
  --accent: #0f3460; --primary: #e94560; --green: #4ecca3; --border: #2a2a4a;
  --bubble-user: #0f3460; --bubble-ai: #1a1a3e; --bubble-tool: #2a1a3e;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
  --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right);
}
html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: -apple-system, system-ui, sans-serif; font-size: 15px; }
#app { display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; padding-left: var(--sal); padding-right: var(--sar); }

/* 顶部状态栏 */
.header { padding: 12px 16px; padding-top: calc(12px + var(--sat)); background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.header .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex-shrink: 0; }
.header .dot.connected { background: var(--green); }
.header .title { font-weight: 600; font-size: 16px; }
.header .model { color: var(--fg2); font-size: 13px; margin-left: auto; }

/* 消息列表 */
.messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; font-size: 14px; }
.msg.user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 4px; color: #c0d8ff; }
.msg.assistant { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
.msg.tool { align-self: flex-start; background: var(--bubble-tool); border-bottom-left-radius: 4px; font-size: 12px; color: var(--fg2); border: 1px solid #3a2a5a; }
.msg.tool .tool-name { color: var(--primary); font-weight: 600; }
.msg.streaming::after { content: '▋'; animation: blink 1s infinite; color: var(--primary); }
@keyframes blink { 50% { opacity: 0; } }

/* 状态提示 */
.status-bar { padding: 6px 16px; text-align: center; font-size: 12px; color: var(--fg2); background: var(--bg2); border-top: 1px solid var(--border); flex-shrink: 0; }

/* 工具确认弹窗 */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: var(--sat) var(--sar) var(--sab) var(--sal); }
.modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; width: 90%; max-width: 400px; }
.modal h3 { font-size: 16px; margin-bottom: 12px; color: var(--fg); }
.modal .tool-info { font-size: 13px; color: var(--fg2); margin-bottom: 16px; background: var(--bg); padding: 10px; border-radius: 8px; max-height: 200px; overflow-y: auto; word-break: break-all; }
.modal .btns { display: flex; gap: 10px; }
.modal .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
.modal .btn.allow { background: var(--green); color: #1a1a2e; }
.modal .btn.reject { background: var(--primary); color: #fff; }

/* 输入区域 */
.input-area { padding: 8px 12px; padding-bottom: calc(8px + var(--sab)); background: var(--bg2); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
.input-area textarea { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px; color: var(--fg); font-size: 15px; resize: none; outline: none; max-height: 120px; font-family: inherit; line-height: 1.4; }
.input-area textarea:focus { border-color: var(--primary); }
.input-area .send-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--primary); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.input-area .send-btn:disabled { opacity: 0.4; }
.input-area .cancel-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: #c44; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* Markdown 基本样式 */
.msg code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.msg pre { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
.msg pre code { background: none; padding: 0; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="dot" id="statusDot"></div>
    <span class="title">🦞 Sprite</span>
    <span class="model" id="modelName">--</span>
  </div>
  <div class="messages" id="messages"></div>
  <div class="status-bar" id="statusBar">正在连接...</div>
  <div class="input-area" id="inputArea">
    <textarea id="input" rows="1" placeholder="输入消息..." autocomplete="off"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
  </div>
</div>

<!-- 工具确认弹窗 -->
<div class="modal-overlay" id="toolModal" style="display:none">
  <div class="modal">
    <h3>🔧 工具调用确认</h3>
    <div class="tool-info" id="toolInfo"></div>
    <div class="btns">
      <button class="btn allow" onclick="confirmTool('allow')">✓ 允许</button>
      <button class="btn reject" onclick="confirmTool('reject')">✗ 拒绝</button>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const wsUrl = `${wsProto}//${location.host}/ws?token=${token}`;

let ws = null;
let state = 'idle'; // idle | loading | tool_confirm
let streamingEl = null;

const messagesEl = document.getElementById('messages');
const statusBar = document.getElementById('statusBar');
const statusDot = document.getElementById('statusDot');
const modelName = document.getElementById('modelName');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const toolModal = document.getElementById('toolModal');
const toolInfo = document.getElementById('toolInfo');
const inputArea = document.getElementById('inputArea');

function connect() {
  ws = new WebSocket(wsUrl);
  ws.onopen = () => {
    statusDot.classList.add('connected');
    statusBar.textContent = '已连接';
    ws.send(JSON.stringify({ type: 'sync' }));
  };
  ws.onclose = () => {
    statusDot.classList.remove('connected');
    statusBar.textContent = '连接断开，3秒后重连...';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    try { handleMessage(JSON.parse(e.data)); } catch(err) { console.error('消息解析错误', err); }
  };
}

function handleMessage(msg) {
  switch(msg.type) {
    case 'stream_chunk':
      // msg.content 是全量流式内容（非增量），直接替换
      if (!streamingEl) {
        streamingEl = addMsg('assistant', '', true);
      }
      streamingEl.innerHTML = renderMd(msg.content);
      streamingEl.classList.add('streaming');
      scrollToBottom();
      state = 'loading';
      updateUI();
      break;

    case 'message':
      if (msg.role === 'assistant' && streamingEl) {
        // 流式结束，用最终完整内容替换
        streamingEl.classList.remove('streaming');
        streamingEl.innerHTML = renderMd(msg.content);
        streamingEl = null;
      } else if (msg.role === 'assistant') {
        // 非流式的 assistant 消息（如 sync 后补发）
        addMsg('assistant', msg.content);
      } else {
        // user 消息（从终端发来的，需要显示）
        addMsg(msg.role, msg.content);
      }
      scrollToBottom();
      break;

    case 'tool_confirm_request':
      state = 'tool_confirm';
      let info = '';
      for (const t of msg.tools) {
        info += `<b>${escHtml(t.name)}</b>\n${escHtml(t.confirm_message)}\n\n`;
      }
      toolInfo.innerHTML = info;
      toolModal.style.display = 'flex';
      updateUI();
      break;

    case 'tool_result':
      const toolEl = addMsg('tool', '');
      toolEl.innerHTML = `<span class="tool-name">🔧 ${escHtml(msg.tool_call_id.substring(0,8))}</span> ${msg.is_error ? '❌' : '✅'}\n${escHtml(truncate(msg.output, 200))}`;
      scrollToBottom();
      break;

    case 'status':
      state = msg.state;
      // 流式结束但没收到 message 事件时，清理 streaming 状态
      if (state === 'idle' && streamingEl) {
        streamingEl.classList.remove('streaming');
        streamingEl = null;
      }
      updateUI();
      break;

    case 'session_sync':
      messagesEl.innerHTML = '';
      streamingEl = null;
      for (const m of msg.messages) {
        addMsg(m.role, m.content);
      }
      modelName.textContent = msg.model || '--';
      state = msg.status;
      updateUI();
      scrollToBottom();
      break;

    case 'pong':
      break;

    case 'error':
      statusBar.textContent = '⚠️ ' + msg.message;
      break;
  }
}

function addMsg(role, content, raw) {
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'user' : role === 'tool' ? 'tool' : 'assistant');
  if (!raw) el.innerHTML = role === 'user' ? escHtml(content) : renderMd(content);
  messagesEl.appendChild(el);
  return el;
}

function sendMessage() {
  const text = input.value.trim();
  if (!text || state === 'loading') return;
  ws.send(JSON.stringify({ type: 'send_message', content: text }));
  addMsg('user', text);
  input.value = '';
  autoResize();
  scrollToBottom();
  state = 'loading';
  updateUI();
}

function confirmTool(action) {
  ws.send(JSON.stringify({ type: 'tool_confirm', action }));
  toolModal.style.display = 'none';
  state = 'loading';
  updateUI();
}

function cancelStream() {
  ws.send(JSON.stringify({ type: 'cancel' }));
}

function updateUI() {
  const isLoading = state === 'loading';
  sendBtn.disabled = isLoading;
  if (isLoading) {
    statusBar.textContent = '⏳ AI 思考中...';
    if (!document.getElementById('cancelBtn')) {
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'cancel-btn';
      cancelBtn.id = 'cancelBtn';
      cancelBtn.textContent = '■';
      cancelBtn.onclick = cancelStream;
      sendBtn.style.display = 'none';
      inputArea.appendChild(cancelBtn);
    }
  } else {
    if (state === 'tool_confirm') {
      statusBar.textContent = '🔧 等待工具确认...';
    } else {
      statusBar.textContent = '已连接';
    }
    const cancelBtn = document.getElementById('cancelBtn');
    if (cancelBtn) { cancelBtn.remove(); sendBtn.style.display = ''; }
  }
}

function scrollToBottom() {
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

function truncate(s, n) {
  return s && s.length > n ? s.substring(0, n) + '...' : (s || '');
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// 简易 Markdown 渲染
function renderMd(text) {
  if (!text) return '';
  let html = escHtml(text);
  // code blocks
  html = html.replace(/```(\w*)<br>([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // bold
  html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  // italic
  html = html.replace(/\*([^*]+)\*/g, '<i>$1</i>');
  // links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--green)">$1</a>');
  return html;
}

// 自动调整输入框高度
function autoResize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}
input.addEventListener('input', autoResize);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ping 心跳
setInterval(() => {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'ping' }));
  }
}, 30000);

connect();
</script>
</body>
</html>
